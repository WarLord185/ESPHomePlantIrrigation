esphome:
  name: plantirrigation
  friendly_name: PlantIrrigation
  on_boot:
    - priority: 800
      then:
        - delay: 2s
    - priority: 600
      then:
        - lambda: |-
            for (int i = 0; i < 128; i++) {
              id(temp_buf)[i]  = NAN;
              id(hum_buf)[i]   = NAN;
              id(soil_buf)[i]  = NAN;
              id(water_buf)[i] = NAN;
            }
    - priority: -100
      then:
        - delay: 3s
        - output.turn_off: pump_output
        - output.turn_off: pump_led_output
        - script.execute: sensing_loop

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:

api:
  id: api_server
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:

deep_sleep:
  id: deep_sleep_ctrl
  wakeup_pin:
    number: GPIO3
    inverted: true
    allow_other_uses: true
    mode:
      input: true
      pullup: true
  wakeup_pin_mode: KEEP_AWAKE

i2c:
  sda: 6
  scl: 7
  scan: true
  frequency: 100000Hz

globals:
  # ── Graph buffers ──
  - id: display_mode
    type: int
    restore_value: no
    initial_value: '0'
  - id: temp_buf
    type: float[128]
    restore_value: no
  - id: hum_buf
    type: float[128]
    restore_value: no
  - id: soil_buf
    type: float[128]
    restore_value: no
  - id: water_buf
    type: float[128]
    restore_value: no
  - id: buf_index
    type: int
    restore_value: no
    initial_value: '0'
  # ── Sampling accumulators ──
  - id: soil_accum
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: water_accum
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: soil_last
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: water_last
    type: float
    restore_value: no
    initial_value: 'NAN'
  # ── Tank geometry ──
  - id: tank_height_cm
    type: float
    restore_value: yes
    initial_value: '398.0'
  # ── Settings state ──
  - id: in_settings
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: settings_cursor
    type: int
    restore_value: no
    initial_value: '0'
  - id: settings_scroll
    type: int
    restore_value: no
    initial_value: '0'
  # submode: 0=list  1=interval adjust  2=soil dry cal  3=soil wet cal
  #          4=tank height  5=pump duration
  - id: settings_submode
    type: int
    restore_value: no
    initial_value: '0'
  # ── Persistent user settings ──
  - id: sensing_interval_idx
    type: int
    restore_value: yes
    initial_value: '2'
  - id: soil_dry_v
    type: float
    restore_value: yes
    initial_value: '2.5820'
  - id: soil_wet_v
    type: float
    restore_value: yes
    initial_value: '0.8960'
  - id: soil_raw_latest
    type: float
    restore_value: no
    initial_value: 'NAN'
  # ── Pump settings ──
  # pump_duration_idx: index into preset table (default 5 = 30s)
  # Presets: 1s,5s,10s,15s,20s,30s,45s,1min,2min,3min,5min
  - id: pump_duration_idx
    type: int
    restore_value: yes
    initial_value: '5'
  # pump_auto_enabled: whether the auto-pump trigger is active
  - id: pump_auto_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  # ── Alert one-shot flags ──
  - id: tank_alert_sent
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: temp_alert_sent
    type: bool
    restore_value: no
    initial_value: 'false'

output:
  - platform: ledc
    pin: 2
    id: humidity_pwm
    frequency: 1000Hz
  - platform: gpio
    pin: 21
    id: pump_led_output
  - platform: gpio
    pin: 1
    id: pump_output
  - platform: ledc
    pin: 22
    id: buzzer_output
    frequency: 1000Hz

switch:
  - platform: template
    name: "LED Bar Graph"
    id: led_bar_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      then:
        - lambda: |-
            float w = id(water_last);
            if (isnan(w) || w < 0) w = 0;
            if (w > 100) w = 100;
            id(humidity_pwm).set_level(w / 100.0f);
    turn_off_action:
      then:
        - lambda: id(humidity_pwm).set_level(0.0f);

  - platform: template
    name: "Water Pump"
    id: pump_switch
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      then:
        - output.turn_on: pump_output
        - output.turn_on: pump_led_output
    turn_off_action:
      then:
        - output.turn_off: pump_output
        - output.turn_off: pump_led_output

binary_sensor:
  # ── GPIO18: BACK ──
  - platform: gpio
    pin:
      number: 18
      mode: INPUT
    id: back_button
    name: "Back Button"
    device_class: power
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(in_settings);'
            then:
              - script.execute: settings_nav_back
            else:
              - lambda: |-
                  id(display_mode) = (id(display_mode) + 4) % 5;

  # ── GPIO19: SELECT — hold 5s to enter/exit settings ──
  - platform: gpio
    pin:
      number: 19
      mode: INPUT
    id: select_button
    name: "Select Button"
    device_class: power
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - script.execute: hold_select_timer
    on_release:
      then:
        - if:
            condition:
              script.is_running: hold_select_timer
            then:
              - script.stop: hold_select_timer
              - if:
                  condition:
                    lambda: 'return id(in_settings);'
                  then:
                    - script.execute: settings_select_action

  # ── GPIO20: FORWARD ──
  - platform: gpio
    pin:
      number: 20
      mode: INPUT
    id: forward_button
    name: "Forward Button"
    device_class: power
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(in_settings);'
            then:
              - script.execute: settings_nav_forward
            else:
              - lambda: |-
                  id(display_mode) = (id(display_mode) + 1) % 5;

  # ── GPIO3: Sleep — disabled while in settings ──
  - platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      inverted: true
      allow_other_uses: true
    id: sleep_button
    name: "Sleep Button"
    device_class: power
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(in_settings);'
            then:
              - logger.log: "Sleep button pressed — entering deep sleep"
              - deep_sleep.enter: deep_sleep_ctrl

sensor:
  - platform: template
    name: "Soil Moisture Raw ADC"
    id: soil_moisture_raw
    unit_of_measurement: "V"
    accuracy_decimals: 4
    update_interval: never

  - platform: adc
    pin: 0
    name: "Soil Moisture ADC Internal"
    id: soil_moisture_adc
    unit_of_measurement: "V"
    attenuation: 12db
    update_interval: never
    internal: true

  - platform: template
    name: "Soil Moisture"
    id: soil_moisture
    unit_of_measurement: "%"
    device_class: moisture
    accuracy_decimals: 1
    update_interval: never
    on_value:
      then:
        - lambda: |-
            id(soil_last) = x;
            id(soil_buf)[id(buf_index)] = x;
        - if:
            condition:
              # Auto-pump: soil dry, pump not already running, not in settings, auto enabled
              lambda: 'return x <= 30.0 && !id(pump_switch).state && !id(in_settings) && id(pump_auto_enabled);'
            then:
              - script.execute: pump_run

  - platform: sht4x
    precision: High
    update_interval: 30s
    temperature:
      name: "Room Temperature"
      id: room_temp
      on_value:
        then:
          - lambda: id(temp_buf)[id(buf_index)] = x;
          - if:
              condition:
                lambda: 'return x >= 30.0f && !id(temp_alert_sent);'
              then:
                - lambda: id(temp_alert_sent) = true;
                - logger.log:
                    format: "ALERT: High ambient temperature %.1f C"
                    args: ['x']
                    level: WARN
                - homeassistant.service:
                    service: notify.notify
                    variables:
                      temp: return x;
                    data_template:
                      title: "🌡️ High Ambient Temperature"
                      message: "The ambient temperature is {{ temp | round(1) }}°C."
          - if:
              condition:
                lambda: 'return x < 28.0f && id(temp_alert_sent);'
              then:
                - lambda: id(temp_alert_sent) = false;
    humidity:
      name: "Room Humidity"
      id: room_humidity
      on_value:
        then:
          - lambda: |-
              id(hum_buf)[id(buf_index)] = x;
              id(buf_index) = (id(buf_index) + 1) % 128;

  - platform: ultrasonic
    trigger_pin: 15
    echo_pin: 23
    name: "Water Tank Distance"
    id: water_distance
    internal: true
    update_interval: never
    pulse_time: 10us
    timeout: 4m

  - platform: template
    name: "Water Tank Level"
    id: water_level
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:water-percent"
    update_interval: never
    on_value:
      then:
        - lambda: |-
            id(water_last) = x;
            id(water_buf)[id(buf_index)] = x;
            if (!id(led_bar_enabled).state) return;
            float w = x;
            if (w < 0) w = 0;
            if (w > 100) w = 100;
            id(humidity_pwm).set_level(w / 100.0f);
        - if:
            condition:
              lambda: 'return x <= 10.0f && !id(tank_alert_sent);'
            then:
              - lambda: id(tank_alert_sent) = true;
              - logger.log:
                  format: "ALERT: Water tank critically low at %.1f%%"
                  args: ['x']
                  level: WARN
              - script.execute: buzzer_alert
              - homeassistant.service:
                  service: notify.notify
                  variables:
                    level: return x;
                  data_template:
                    title: "⚠️ Water Tank Critically Low"
                    message: "Water tank level is at {{ level | int }}% — please refill soon."
        - if:
            condition:
              lambda: 'return x > 15.0f && id(tank_alert_sent);'
            then:
              - lambda: id(tank_alert_sent) = false;

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto"
    id: font_medium
    size: 16

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled
    setup_priority: -100
    update_interval: 1s
    lambda: |-
      // ── Shared label helpers ──
      auto interval_label = [](int i) -> const char* {
        const char* labels[] = {
          "10 sec","30 sec","1 min","2 min","5 min",
          "10 min","15 min","30 min","1 hr",
          "2 hr","4 hr","6 hr","12 hr"
        };
        if (i < 0)  i = 0;
        if (i > 12) i = 12;
        return labels[i];
      };
      auto pump_dur_label = [](int i) -> const char* {
        const char* labels[] = {
          "1 sec","5 sec","10 sec","15 sec","20 sec",
          "30 sec","45 sec","1 min","2 min","3 min","5 min"
        };
        if (i < 0)  i = 0;
        if (i > 10) i = 10;
        return labels[i];
      };

      if (id(in_settings)) {

        int submode = id(settings_submode);
        int cursor  = id(settings_cursor);
        int scroll  = id(settings_scroll);

        if (submode == 1) {
          // ════════════════════════════════
          // Interval Adjust Sub-page
          // title(y=0) | divider(y=11) | bar(y=14,h=8) | label(y=25) | divider(y=46) | hint(y=54)
          // font_small renders from y to y+9; y=54 → pixels 54-63 fits exactly in 64px
          // ════════════════════════════════
          it.printf(0, 0, id(font_small), "Sensing Interval");
          it.line(0, 11, 128, 11);
          int idx = id(sensing_interval_idx);
          int fill = (idx == 0) ? 1 : (int)((float)idx / 12.0f * 104.0f);
          it.rectangle(12, 14, 104, 8);
          it.filled_rectangle(12, 14, fill, 8);
          it.printf(20, 25, id(font_small), "%s", interval_label(idx));
          it.line(0, 52, 128, 52);
          it.printf(4, 54, id(font_small), "DEC   SAVE   INC");

        } else if (submode == 2 || submode == 3) {
          // ════════════════════════════════
          // Soil Cal Sub-page (DRY or WET)
          // ════════════════════════════════
          if (submode == 2)
            it.printf(0, 0, id(font_small), "Soil Cal DRY 0%%");
          else
            it.printf(0, 0, id(font_small), "Soil Cal WET 100%%");
          it.line(0, 11, 128, 11);
          if (isnan(id(soil_raw_latest)))
            it.printf(0, 13, id(font_small), "Live: reading...");
          else
            it.printf(0, 13, id(font_small), "Live: %.4fV", id(soil_raw_latest));
          float saved = (submode == 2) ? id(soil_dry_v) : id(soil_wet_v);
          it.printf(0, 25, id(font_small), "Saved:%.4fV", saved);
          it.printf(0, 37, id(font_small), "SEL=save BK=back");
          it.line(0, 52, 128, 52);
          it.printf(4, 54, id(font_small), "BK    SAVE    BK");

        } else if (submode == 4) {
          // ════════════════════════════════
          // Tank Height Adjust Sub-page
          // ════════════════════════════════
          it.printf(0, 0, id(font_small), "Tank Height (cm)");
          it.line(0, 11, 128, 11);
          int h = (int)id(tank_height_cm);
          int fill = (int)(((float)(h - 10) / 390.0f) * 104.0f);
          if (fill < 1)   fill = 1;
          if (fill > 104) fill = 104;
          it.rectangle(12, 14, 104, 8);
          it.filled_rectangle(12, 14, fill, 8);
          it.printf(20, 25, id(font_small), "%d cm", h);
          it.line(0, 52, 128, 52);
          it.printf(4, 54, id(font_small), "DEC   SAVE   INC");

        } else if (submode == 5) {
          // ════════════════════════════════
          // Pump Duration Adjust Sub-page
          // Presets: 1s 5s 10s 15s 20s 30s 45s 1min 2min 3min 5min (idx 0-10)
          // ════════════════════════════════
          it.printf(0, 0, id(font_small), "Pump Duration");
          it.line(0, 11, 128, 11);
          int idx = id(pump_duration_idx);
          int fill = (idx == 0) ? 1 : (int)((float)idx / 10.0f * 104.0f);
          it.rectangle(12, 14, 104, 8);
          it.filled_rectangle(12, 14, fill, 8);
          it.printf(20, 25, id(font_small), "%s", pump_dur_label(idx));
          it.line(0, 52, 128, 52);
          it.printf(4, 54, id(font_small), "DEC   SAVE   INC");

        } else {
          // ════════════════════════════════
          // Settings List  (4 rows visible)
          // Items 0-10, cursor max = 10
          // Row pixel layout:
          //   Header "SETTINGS"  y=0
          //   divider             y=11
          //   row0                y=13  (pixels 13-22)
          //   row1                y=24  (pixels 24-33)
          //   row2                y=35  (pixels 35-44)
          //   row3                y=46  (pixels 46-55)
          //   divider             y=44  ← sits just above row3 text? No.
          // Actually we want footer below row3:
          //   row3 ends at y+9 = 55, footer divider at 43 won't work.
          // Correct layout with 4 rows + footer in 64px:
          //   Header y=0 (h=10), divider y=11
          //   row0 y=13, row1 y=24, row2 y=35, row3 y=46
          //   row3 bottom edge = 46+9 = 55
          //   No room for footer divider below — omit divider, keep footer label at y=54
          //   But that overlaps row3. Solution: show only 3 rows + footer.
          //   row0 y=13, row1 y=24, row2 y=35
          //   row2 bottom = 44, divider y=45, footer y=54  ✓
          // Use 3 visible items + persistent footer.
          // ════════════════════════════════
          it.printf(0, 0, id(font_small), "SETTINGS");
          it.line(0, 11, 128, 11);

          // 3 visible rows
          // row0=y13, row1=y24, row2=y35 (bottom edge y=44)
          // divider y=52 (2px above footer), footer text y=54 (pixels 54-63, fits in 64px)
          for (int i = 0; i < 3; i++) {
            int item = scroll + i;
            if (item > 10) break;
            int y = 13 + i * 11;
            bool sel = (item == cursor);
            char pfx = sel ? '>' : ' ';
            switch (item) {
              case 0:
                it.printf(0, y, id(font_small), "%c Sense:%s",
                  pfx, interval_label(id(sensing_interval_idx)));
                break;
              case 1:
                it.printf(0, y, id(font_small), "%c Read Sensors", pfx);
                break;
              case 2:
                it.printf(0, y, id(font_small), "%c LED Bar:%s",
                  pfx, id(led_bar_enabled).state ? "ON" : "OFF");
                break;
              case 3:
                it.printf(0, y, id(font_small), "%c Run Pump Now", pfx);
                break;
              case 4:
                it.printf(0, y, id(font_small), "%c Auto Pump:%s",
                  pfx, id(pump_auto_enabled) ? "ON" : "OFF");
                break;
              case 5:
                it.printf(0, y, id(font_small), "%c Pump Dur:%s",
                  pfx, pump_dur_label(id(pump_duration_idx)));
                break;
              case 6:
                it.printf(0, y, id(font_small), "%c Soil Dry Cal", pfx);
                break;
              case 7:
                it.printf(0, y, id(font_small), "%c Soil Wet Cal", pfx);
                break;
              case 8:
                it.printf(0, y, id(font_small), "%c Tank Ht:%dcm",
                  pfx, (int)id(tank_height_cm));
                break;
              case 9:
                it.printf(0, y, id(font_small), "%c HA:%s",
                  pfx, id(api_server).is_connected() ? "Connected" : "No Link");
                break;
              case 10:
                it.printf(0, y, id(font_small), "%c Exit Settings", pfx);
                break;
            }
          }

          // Footer: divider 2px above text, text flush to bottom of 64px display
          it.line(0, 52, 128, 52);
          it.printf(4, 54, id(font_small), "BK    SEL    FW");
        }

      } else {
        // ════════════════════════════════
        // Normal Display Modes
        // ════════════════════════════════
        auto draw_graph = [&](float* buf, int cur_idx, float y_min, float y_max,
                              int gx, int gy, int gw, int gh) {
          it.line(gx, gy, gx, gy + gh);
          it.line(gx, gy + gh, gx + gw, gy + gh);
          float range = y_max - y_min;
          if (range == 0) range = 1;
          for (int n = 0; n < gw; n++) {
            int bidx = (cur_idx + n) % 128;
            float v = buf[bidx];
            if (isnan(v)) continue;
            float norm = (v - y_min) / range;
            if (norm < 0) norm = 0;
            if (norm > 1) norm = 1;
            int py = gy + gh - (int)(norm * gh);
            it.draw_pixel_at(gx + n, py);
          }
        };

        if (id(display_mode) == 0) {
          it.printf(0,  0, id(font_small), "Temperature (C)");
          it.printf(80, 0, id(font_small), "%.1f C", id(room_temp).state);
          draw_graph(id(temp_buf), id(buf_index), 15.0, 40.0, 0, 12, 128, 50);
        } else if (id(display_mode) == 1) {
          it.printf(0,  0, id(font_small), "Humidity (%%)");
          it.printf(85, 0, id(font_small), "%.1f%%", id(room_humidity).state);
          draw_graph(id(hum_buf), id(buf_index), 0.0, 100.0, 0, 12, 128, 50);
        } else if (id(display_mode) == 2) {
          it.printf(0, 0, id(font_small), "Soil Moisture (%%)");
          if (isnan(id(soil_last)))
            it.printf(75, 0, id(font_small), "-.-%% ");
          else
            it.printf(75, 0, id(font_small), "%.1f%%", id(soil_last));
          draw_graph(id(soil_buf), id(buf_index), 0.0, 100.0, 0, 12, 128, 50);
        } else if (id(display_mode) == 3) {
          it.printf(0, 0, id(font_small), "Water Tank (%%)");
          if (isnan(id(water_last)))
            it.printf(80, 0, id(font_small), "-.-%% ");
          else
            it.printf(80, 0, id(font_small), "%.1f%%", id(water_last));
          draw_graph(id(water_buf), id(buf_index), 0.0, 100.0, 0, 12, 128, 50);
        } else {
          it.printf(0,  0,  id(font_small),  "Temperature");
          it.printf(65, 0,  id(font_small),  "Humidity");
          it.line(0, 11, 128, 11);
          it.printf(0,  13, id(font_medium), "%.1fC",  id(room_temp).state);
          it.printf(65, 13, id(font_medium), "%.0f%%", id(room_humidity).state);
          it.printf(0,  34, id(font_small),  "Soil Moisture");
          it.printf(65, 34, id(font_small),  "Water Tank");
          it.line(0, 45, 128, 45);
          if (isnan(id(soil_last)))
            it.printf(0,  46, id(font_medium), "-.-%%");
          else
            it.printf(0,  46, id(font_medium), "%.1f%%", id(soil_last));
          if (isnan(id(water_last)))
            it.printf(65, 46, id(font_medium), "-.-%%");
          else
            it.printf(65, 46, id(font_medium), "%.1f%%", id(water_last));
        }
      }

interval:
  # Live ADC polling for soil cal sub-pages
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(in_settings) && (id(settings_submode) == 2 || id(settings_submode) == 3);'
          then:
            - component.update: soil_moisture_adc
            - lambda: id(soil_raw_latest) = id(soil_moisture_adc).state;

button:
  - platform: template
    name: "Test LED Bar Graph"
    on_press:
      then:
        - script.execute: test_led_bar
  - platform: template
    name: "Soil Cal: Read Raw ADC"
    on_press:
      then:
        - script.execute: soil_calibrate_read
  - platform: template
    name: "Soil Cal: Save Dry Value"
    on_press:
      then:
        - script.execute: soil_calibrate_dry
  - platform: template
    name: "Soil Cal: Save Wet Value"
    on_press:
      then:
        - script.execute: soil_calibrate_wet

script:
  # ── Hold SELECT 5s to toggle settings ──
  - id: hold_select_timer
    mode: single
    then:
      - delay: 5s
      - lambda: |-
          id(in_settings) = !id(in_settings);
          id(settings_cursor)  = 0;
          id(settings_scroll)  = 0;
          id(settings_submode) = 0;

  # ── Settings: navigate up / decrease ──
  - id: settings_nav_back
    mode: single
    then:
      - lambda: |-
          int sub = id(settings_submode);
          if (sub == 1) {
            int idx = id(sensing_interval_idx) - 1;
            if (idx < 0) idx = 0;
            id(sensing_interval_idx) = idx;
          } else if (sub == 4) {
            float h = id(tank_height_cm) - 10.0f;
            if (h < 10.0f) h = 10.0f;
            id(tank_height_cm) = h;
          } else if (sub == 5) {
            int idx = id(pump_duration_idx) - 1;
            if (idx < 0) idx = 0;
            id(pump_duration_idx) = idx;
          } else if (sub == 2 || sub == 3) {
            id(settings_submode) = 0;
          } else {
            int c = id(settings_cursor) - 1;
            if (c < 0) c = 0;
            id(settings_cursor) = c;
            if (c < id(settings_scroll))
              id(settings_scroll) = c;
          }

  # ── Settings: navigate down / increase ──
  - id: settings_nav_forward
    mode: single
    then:
      - lambda: |-
          int sub = id(settings_submode);
          if (sub == 1) {
            int idx = id(sensing_interval_idx) + 1;
            if (idx > 12) idx = 12;
            id(sensing_interval_idx) = idx;
          } else if (sub == 4) {
            float h = id(tank_height_cm) + 10.0f;
            if (h > 400.0f) h = 400.0f;
            id(tank_height_cm) = h;
          } else if (sub == 5) {
            int idx = id(pump_duration_idx) + 1;
            if (idx > 10) idx = 10;
            id(pump_duration_idx) = idx;
          } else if (sub == 2 || sub == 3) {
            id(settings_submode) = 0;
          } else {
            int c = id(settings_cursor) + 1;
            if (c > 10) c = 10;
            id(settings_cursor) = c;
            if (c >= id(settings_scroll) + 3)
              id(settings_scroll) = c - 2;
          }

  # ── Settings: confirm / execute current item ──
  - id: settings_select_action
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(settings_submode) != 0;'
          then:
            # ── Submode save actions ──
            - if:
                condition:
                  lambda: 'return id(settings_submode) == 1;'
                then:
                  - lambda: id(settings_submode) = 0;
                  - script.stop: sensing_loop
                  - script.execute: sensing_loop
            - if:
                condition:
                  lambda: 'return id(settings_submode) == 2;'
                then:
                  - lambda: |-
                      if (!isnan(id(soil_raw_latest)))
                        id(soil_dry_v) = id(soil_raw_latest);
            - if:
                condition:
                  lambda: 'return id(settings_submode) == 3;'
                then:
                  - lambda: |-
                      if (!isnan(id(soil_raw_latest)))
                        id(soil_wet_v) = id(soil_raw_latest);
            - if:
                condition:
                  lambda: 'return id(settings_submode) == 4;'
                then:
                  # tank_height_cm already updated live; just return to list
                  - lambda: id(settings_submode) = 0;
            - if:
                condition:
                  lambda: 'return id(settings_submode) == 5;'
                then:
                  # pump_duration_idx already updated live; just return to list
                  - lambda: id(settings_submode) = 0;
          else:
            # ── List item actions (submode == 0) ──
            - if:
                condition:
                  lambda: 'return id(settings_cursor) == 0;'
                then:
                  - lambda: id(settings_submode) = 1;
            - if:
                condition:
                  lambda: 'return id(settings_cursor) == 1;'
                then:
                  - script.execute: soil_sample_avg
                  - script.execute: water_sample_avg
            - if:
                condition:
                  lambda: 'return id(settings_cursor) == 2;'
                then:
                  - switch.toggle: led_bar_enabled
            - if:
                condition:
                  lambda: 'return id(settings_cursor) == 3;'
                then:
                  # One-shot manual pump trigger for the configured duration
                  - script.execute: pump_run
            - if:
                condition:
                  lambda: 'return id(settings_cursor) == 4;'
                then:
                  # Toggle auto-pump enable/disable
                  - lambda: id(pump_auto_enabled) = !id(pump_auto_enabled);
            - if:
                condition:
                  lambda: 'return id(settings_cursor) == 5;'
                then:
                  - lambda: id(settings_submode) = 5;
            - if:
                condition:
                  lambda: 'return id(settings_cursor) == 6;'
                then:
                  - lambda: id(settings_submode) = 2;
            - if:
                condition:
                  lambda: 'return id(settings_cursor) == 7;'
                then:
                  - lambda: id(settings_submode) = 3;
            - if:
                condition:
                  lambda: 'return id(settings_cursor) == 8;'
                then:
                  - lambda: id(settings_submode) = 4;
            # cursor 9 = HA status (read-only, no action)
            - if:
                condition:
                  lambda: 'return id(settings_cursor) == 10;'
                then:
                  - lambda: |-
                      id(in_settings)      = false;
                      id(settings_submode) = 0;

  # ── Pump run: turn on for the configured duration then off ──
  # mode: single prevents overlapping runs (if already running, new call is ignored)
  - id: pump_run
    mode: single
    then:
      - switch.turn_on: pump_switch
      - delay: !lambda |-
          const uint32_t durations_ms[] = {
            1000UL,    //  0 — 1 sec
            5000UL,    //  1 — 5 sec
            10000UL,   //  2 — 10 sec
            15000UL,   //  3 — 15 sec
            20000UL,   //  4 — 20 sec
            30000UL,   //  5 — 30 sec  (default)
            45000UL,   //  6 — 45 sec
            60000UL,   //  7 — 1 min
            120000UL,  //  8 — 2 min
            180000UL,  //  9 — 3 min
            300000UL   // 10 — 5 min
          };
          int idx = id(pump_duration_idx);
          if (idx < 0)  idx = 0;
          if (idx > 10) idx = 10;
          return (uint32_t)durations_ms[idx];
      - switch.turn_off: pump_switch

  # ── Variable-interval sensing loop ──
  - id: sensing_loop
    mode: queued
    max_runs: 2
    then:
      - script.execute: soil_sample_avg
      - script.execute: water_sample_avg
      - delay: !lambda |-
          const uint32_t intervals_ms[] = {
            10000UL,    //  0 — 10 sec
            30000UL,    //  1 — 30 sec
            60000UL,    //  2 — 1 min  (default)
            120000UL,   //  3 — 2 min
            300000UL,   //  4 — 5 min
            600000UL,   //  5 — 10 min
            900000UL,   //  6 — 15 min
            1800000UL,  //  7 — 30 min
            3600000UL,  //  8 — 1 hr
            7200000UL,  //  9 — 2 hr
            14400000UL, // 10 — 4 hr
            21600000UL, // 11 — 6 hr
            43200000UL  // 12 — 12 hr
          };
          int idx = id(sensing_interval_idx);
          if (idx < 0)  idx = 0;
          if (idx > 12) idx = 12;
          return (uint32_t)intervals_ms[idx];
      - script.execute: sensing_loop

  # ── Soil moisture: 5-sample average with dynamic calibration ──
  - id: soil_sample_avg
    mode: single
    then:
      - lambda: id(soil_accum) = 0.0;
      - repeat:
          count: 5
          then:
            - component.update: soil_moisture_adc
            - lambda: |-
                float raw_v = id(soil_moisture_adc).state;
                id(soil_raw_latest) = raw_v;
                id(soil_moisture_raw).publish_state(raw_v);
                id(soil_accum) += raw_v;
            - delay: 200ms
      - lambda: |-
          float avg_v = id(soil_accum) / 5.0f;
          float dry   = id(soil_dry_v);
          float wet   = id(soil_wet_v);
          float pct;
          if (fabsf(wet - dry) < 0.001f) {
            pct = 0.0f;
          } else {
            pct = (avg_v - dry) / (wet - dry) * 100.0f;
          }
          if (pct < 0)   pct = 0;
          if (pct > 100) pct = 100;
          id(soil_moisture).publish_state(pct);

  # ── Water tank: 3-sample ultrasonic average ──
  - id: water_sample_avg
    mode: single
    then:
      - lambda: id(water_accum) = 0.0;
      - repeat:
          count: 3
          then:
            - component.update: water_distance
            - lambda: |-
                float d = id(water_distance).state;
                if (!isnan(d)) id(water_accum) += d;
            - delay: 500ms
      - lambda: |-
          float avg = id(water_accum) / 3.0f;
          if (isnan(avg)) return;
          const float full_m  = 0.02f;
          const float empty_m = id(tank_height_cm) / 100.0f + 0.02f;
          float pct = ((100.0f) / (full_m - empty_m)) * avg
                    + (100.0f - (((100.0f) / (full_m - empty_m)) * full_m));
          if (pct < 0)   pct = 0;
          if (pct > 100) pct = 100;
          id(water_level).publish_state(pct);

  # ── HA dashboard calibration buttons (log-based) ──
  - id: soil_calibrate_read
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("soil_cal", "==============================");
          ESP_LOGI("soil_cal", " SOIL CALIBRATION - RAW READ");
          ESP_LOGI("soil_cal", "==============================");
      - repeat:
          count: 5
          then:
            - component.update: soil_moisture_adc
            - lambda: |-
                float raw_v = id(soil_moisture_adc).state;
                id(soil_raw_latest) = raw_v;
                ESP_LOGI("soil_cal", "  Raw ADC: %.4f V", raw_v);
            - delay: 1s
      - lambda: |-
          ESP_LOGI("soil_cal", "Dry(0%%): %.4f V  Wet(100%%): %.4f V",
            id(soil_dry_v), id(soil_wet_v));
          ESP_LOGI("soil_cal", "==============================");

  - id: soil_calibrate_dry
    mode: single
    then:
      - component.update: soil_moisture_adc
      - lambda: |-
          float raw_v = id(soil_moisture_adc).state;
          id(soil_dry_v)       = raw_v;
          id(soil_raw_latest)  = raw_v;
          ESP_LOGI("soil_cal", "DRY (0%%) saved: %.4f V", raw_v);

  - id: soil_calibrate_wet
    mode: single
    then:
      - component.update: soil_moisture_adc
      - lambda: |-
          float raw_v = id(soil_moisture_adc).state;
          id(soil_wet_v)       = raw_v;
          id(soil_raw_latest)  = raw_v;
          ESP_LOGI("soil_cal", "WET (100%%) saved: %.4f V", raw_v);

  # ── Buzzer alert: 3 short beeps (tank low warning) ──
  - id: buzzer_alert
    mode: single
    then:
      - repeat:
          count: 3
          then:
            - lambda: id(buzzer_output).set_level(0.5f);
            - delay: 200ms
            - lambda: id(buzzer_output).set_level(0.0f);
            - delay: 150ms

  # ── LED bar graph test sweep ──
  - id: test_led_bar
    mode: single
    then:
      - lambda: ESP_LOGI("test", "Starting LED bar graph test...");
      - lambda: id(humidity_pwm).set_level(0.0f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.1f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.2f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.3f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.4f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.5f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.6f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.7f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.8f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.9f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(1.0f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.9f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.8f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.7f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.6f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.5f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.4f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.3f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.2f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.1f);
      - delay: 500ms
      - lambda: id(humidity_pwm).set_level(0.0f);
      - delay: 500ms
      - lambda: |-
          if (id(led_bar_enabled).state) {
            float w = id(water_last);
            if (isnan(w) || w < 0) w = 0;
            if (w > 100) w = 100;
            id(humidity_pwm).set_level(w / 100.0f);
            ESP_LOGI("test", "Test complete. Restored to %.1f%%", w);
          } else {
            id(humidity_pwm).set_level(0.0f);
            ESP_LOGI("test", "Test complete. LED bar off (switch is off).");
          }